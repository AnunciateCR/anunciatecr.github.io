const IC={love:'<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>',like:'<path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/>',dislike:'<path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/>',chat:'<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>'};
const WA_SVG='<svg viewBox="0 0 24 24"><path fill="#25D366" d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2z"/><path fill="#fff" d="M17.5 14.4c-.3-.1-1.8-.9-2-1s-.5-.1-.7.1-.8 1-.9 1.1-.3.2-.6.1a7.4 7.4 0 0 1-3.7-3.2c-.3-.5.3-.5.8-1.5.1-.2 0-.4 0-.5l-1-2.3c-.2-.5-.5-.5-.7-.5h-.6a1.2 1.2 0 0 0-.9.4 3.6 3.6 0 0 0-1.1 2.7 6.3 6.3 0 0 0 1.3 3.3 14.4 14.4 0 0 0 5.6 4.9c2.1.9 2.9 1 3.9.8a3.3 3.3 0 0 0 2.2-1.5 2.7 2.7 0 0 0 .2-1.5c-.1-.1-.3-.2-.6-.3z"/></svg>';
const SFB='<svg viewBox="0 0 24 24"><path fill="currentColor" d="M13.5 21v-7.5h2.6l.4-3h-3V8.6c0-.9.3-1.5 1.5-1.5h1.6V4.4c-.3 0-1.2-.1-2.3-.1-2.3 0-3.8 1.4-3.8 3.9v2.3H7.9v3h2.6V21z"/></svg>';
const SIG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>';
const fbUrl=v=>/^https?:\/\//i.test(v)?v:`https://facebook.com/${v.replace(/^@/,'')}`;
const igUrl=v=>/^https?:\/\//i.test(v)?v:`https://instagram.com/${v.replace(/^@/,'')}`;
const waLink=(b,m)=>`https://wa.me/${esc(b.wa)}?text=${encodeURIComponent(m)}`;
const reactBar=(p,v='')=>{const b=bz(p.bid),lk=(p.react||{}).love||0;
 return`<div class="rb ${v}" data-p="${p.id}" data-v="${v}"><button class="rx ${myReact[p.id]=='love'?'on':''}" data-k="love" aria-label="Me gusta" onclick="react('${p.id}','love')"><svg viewBox="0 0 24 24">${IC.love}</svg><span class="lb">Me gusta</span><span class="ct">${lk||''}</span></button><button class="rx cmt" aria-label="Comentarios" onclick="openC('${p.id}')"><svg viewBox="0 0 24 24">${IC.chat}</svg><span class="lb">Comentarios</span><span class="ct">${p.cc||''}</span></button>${b&&b.wa?`<a class="rx wa" target="_blank" rel="noopener" aria-label="Contactar por WhatsApp" href="${waLink(b,`Hola ${b.name}, vi su publicación en AnunciateCR: "${p.text}". Quisiera más información.`)}">${WA_SVG}<span class="lb">Contactar</span></a>`:''}</div>`};
let lt=0,lp=null,lto,ptab='pub';
const bigHeart=box=>{const h=document.createElement('i');h.className='bh';h.textContent='❤️';box.appendChild(h);setTimeout(()=>h.remove(),900)};
window.dbl=(e,pid,single)=>{const n=Date.now(),t=e.currentTarget,box=t.tagName=='VIDEO'?t.parentElement:t;
 if(lp==pid&&n-lt<320){clearTimeout(lto);lt=0;bigHeart(box);if(myReact[pid]!='love')react(pid,'love')}
 else{lt=n;lp=pid;clearTimeout(lto);if(single)lto=setTimeout(single,320)}};
window.setT=t=>{ptab=t;render()};
window.react=async(pid,k)=>{
 if(!me){alert('Inicia sesión para reaccionar');return go('perfil')}
 const p=posts.find(x=>x.id==pid);if(!p)return;
 const r={love:0,like:0,dislike:0,...(p.react||{})},prev=myReact[pid];
 if(prev)r[prev]=Math.max(0,r[prev]-1);
 if(prev==k)delete myReact[pid];else{r[k]++;myReact[pid]=k}
 p.react=r;
 document.querySelectorAll(`[data-p="${pid}"]`).forEach(el=>{el.outerHTML=reactBar(p,el.dataset.v)});
 if(myReact[pid]==k)document.querySelectorAll(`[data-p="${pid}"] .rx[data-k="${k}"]`).forEach(b=>{b.classList.add('pop');if(k=='love')for(let i=0;i<6;i++){const f=document.createElement('i');f.className='fl';f.textContent='❤️';f.style.setProperty('--dx',(Math.random()*60-30)+'px');f.style.animationDelay=(i*60)+'ms';b.appendChild(f);setTimeout(()=>f.remove(),1300)}});
 try{await db.upd('posts',pid,{react:r});await saveUser()}catch(e){alert('No se pudo guardar tu reacción: '+e.message)}};
window.rate=async(bid,n)=>{
 if(!me){alert('Inicia sesión para calificar');return go('perfil')}
 const b=bz(bid);if(b.owner==me.uid)return alert('No puedes calificar tu propio negocio');
 await db.set('ratings',`${bid}_${me.uid}`,{bid,uid:me.uid,stars:n});await load();render()};
let cpid=null;
window.openC=async pid=>{cpid=pid;$('cback').hidden=false;const el=$('csheet');el.hidden=false;
 el.innerHTML='<div class="ch"><span>💬 Comentarios</span><span onclick="closeC()" style="cursor:pointer;font-size:20px">✕</span></div><div class="cl2" id="cl"><p class="mu">Cargando…</p></div><div class="cf"><input id="ci" maxlength="300" placeholder="Escribe un comentario…"><button class="btn" onclick="sendC()">Enviar</button></div>';await showC()};
const showC=async()=>{let L2=[];try{L2=(await db.where('comments','pid',cpid)).sort((a,b)=>a.ts-b.ts).slice(-50)}catch(e){}const el=$('cl');if(!el)return;
 el.innerHTML=L2.map(c=>`<div class="ci"><b>${esc(c.name)}</b><small>${ago(c.ts)}</small><div>${esc(c.text)}</div></div>`).join('')||'<p class="mu">Sé el primero en comentar.</p>';el.scrollTop=el.scrollHeight};
window.closeC=()=>{$('csheet').hidden=true;$('cback').hidden=true;cpid=null};
window.sendC=async()=>{if(!me){alert('Inicia sesión para comentar');closeC();closeShorts();return go('perfil')}
 const t=$('ci').value.trim();if(!t)return;const p=posts.find(x=>x.id==cpid);
 try{await db.add('comments',{pid:cpid,uid:me.uid,name:me.email.split('@')[0],text:t,ts:Date.now()});p.cc=(p.cc||0)+1;db.upd('posts',cpid,{cc:p.cc}).catch(()=>{});$('ci').value='';
  document.querySelectorAll(`[data-p="${cpid}"]`).forEach(el=>{el.outerHTML=reactBar(p,el.dataset.v)});await showC()}catch(e){alert('No se pudo enviar: '+e.message)}};
window.loadR=async bid=>{let L2=[];try{L2=(await db.where('reviews','bid',bid)).sort((a,b)=>b.ts-a.ts).slice(0,30)}catch(e){}const el=$('rvl');if(!el)return;
 el.innerHTML=L2.map(r=>`<div class="rv"><b>${esc(r.name)}</b> <span class="st">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)}</span> <small class="mu">${ago(r.ts)}</small><div>${esc(r.text)}</div></div>`).join('')||'<p class="mu" style="margin-top:10px">Aún no hay reseñas. ¡Sé el primero!</p>'};
window.sendR=async bid=>{if(!me){alert('Inicia sesión para dejar una reseña');return go('perfil')}
 const b=bz(bid);if(b.owner==me.uid)return alert('No puedes reseñar tu propio negocio');
 const st=(ratings.find(r=>r.bid==bid&&r.uid==me.uid)||{}).stars||0,t=$('rt').value.trim();
 if(!st)return alert('Primero elige las estrellas ★');if(!t)return alert('Escribe tu reseña');
 try{await db.set('reviews',`${bid}_${me.uid}`,{bid,uid:me.uid,name:me.email.split('@')[0],stars:st,text:t,ts:Date.now()});$('rt').value='';await loadR(bid)}catch(e){alert('No se pudo guardar: '+e.message)}};
let fio;function autoplay(){fio?.disconnect();
 fio=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target;(e.isIntersecting&&e.intersectionRatio>=.6)?v.play().catch(()=>{}):v.pause()}),{threshold:[0,.6]});
 document.querySelectorAll('.fv').forEach(v=>fio.observe(v))}
const seen=new Set();
const thumbOf=p=>p.thumb||(/cloudinary/.test(p.video||'')?p.video.replace(/\.\w+$/,'.jpg'):'');
const openNow=h=>{const m=[...(h||'').matchAll(/(\d{1,2})(?::(\d{2}))?\s*([ap])\.?m/gi)];if(m.length<2)return null;
 const t=x=>(+x[1]%12+(x[3].toLowerCase()=='p'?12:0))*60+(+x[2]||0),n=new Date(),c=n.getHours()*60+n.getMinutes(),a=t(m[0]),b=t(m[1]);return a<=b?(c>=a&&c<b):(c>=a||c<b)};
window.fol=async bid=>{if(!me){alert('Inicia sesión para guardar negocios');return go('perfil')}
 const b=bz(bid),on=myFollow.includes(bid);myFollow=on?myFollow.filter(x=>x!=bid):[...myFollow,bid];
 await saveUser();await db.upd('businesses',bid,{followers:Math.max(0,(b.followers||0)+(on?-1:1))});await load();render()};
const kfmt=n=>n>=1000?(n/1000).toFixed(1).replace(/\.0$/,'')+'k':n;
window.setCat2=c=>{cat2=c;render()};
window.setZona=()=>{const z=prompt('¿En qué zona buscas? (ej. Guápiles, Cariari, Pococí). Déjalo vacío para ver todas.',zona);if(z!==null){zona=z.trim();render()}};
init();
