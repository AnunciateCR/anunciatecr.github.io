.sc{width:176px;height:245px}.sc .t{font-size:12px}

const CATS=[["🍔","Comida"],["💇","Barberías"],["💅","Uñas"],["🔧","Mecánicos"],["👗","Ropa"],["🏠","Hogar"],["📱","Tecnología"],["🚗","Automóviles"],["🐶","Mascotas"],["✨","Belleza"],["🛠️","Servicios"]];

const cloudUp=(f,onp)=>new Promise((res,rej)=>{const x=new XMLHttpRequest(),d=new FormData();d.append('file',f);d.append('upload_preset',CLOUD.preset);
 x.open('POST',`https://api.cloudinary.com/v1_1/${CLOUD.cloud}/video/upload`);
 x.upload.onprogress=e=>e.lengthComputable&&onp&&onp(Math.round(e.loaded/e.total*100));
 x.onload=()=>{try{const j=JSON.parse(x.responseText);(x.status<300&&j.secure_url)?res(j.secure_url):rej(Error(j.error?.message||'Error al subir el video'))}catch(e){rej(Error('Respuesta inválida de Cloudinary'))}};
 x.onerror=()=>rej(Error('Sin conexión con Cloudinary'));x.send(d)});

/* ====== 2. CAPA DE DATOS (Firebase o demo local) ====== */
let db,auth;
const seed={businesses:[
 {id:"b1",name:"Taller Pérez",cat:"Mecánicos",desc:"Frenos, aceite y diagnóstico. Atención rápida.",loc:"Guápiles, Pococí",hours:"Lun-Sáb 7am-5pm",wa:"50688888888",rating:4.8,followers:12,owner:"x"},
 {id:"b2",name:"Uñas Sofi",cat:"Uñas",desc:"Diseños acrílicos y gel. Con cita.",loc:"Guápiles centro",hours:"Mar-Dom 9am-6pm",wa:"50677777777",rating:4.9,followers:30,owner:"x"},
 {id:"b3",name:"Barber CR",cat:"Barberías",desc:"Cortes clásicos y fade.",loc:"Cariari, Pococí",hours:"Lun-Sáb 8am-7pm",wa:"50666666666",rating:4.7,followers:21,owner:"x"},
 {id:"b4",name:"Dulce Tico",cat:"Comida",desc:"Repostería por encargo.",loc:"Pococí",hours:"Todos los días 10am-8pm",wa:"50655555555",rating:4.6,followers:9,owner:"x"}],
 posts:[
 {id:"p1",bid:"b1",text:"Servicio de frenos esta semana 🔧",ts:Date.now()-72e5},
 {id:"p2",bid:"b2",text:"Nuevos diseños de uñas 💅",ts:Date.now()-18e6},

 {id:"p4",bid:"b4",text:"Tres leches y tarta de fresa disponibles 🍰",ts:Date.now()-5e7}]};
const mem={};
const L=k=>{try{return JSON.parse(localStorage.getItem('ts_'+k)||'null')}catch(e){return mem[k]??null}};
const S=(k,v)=>{mem[k]=v;try{localStorage.setItem('ts_'+k,JSON.stringify(v))}catch(e){}};

async function init(){
 if(!DEMO){const c=L('cache');if(c){biz=c.biz;posts=c.posts;ratings=c.ratings;render()}}
 if(DEMO){
  for(const c of['businesses','posts','users','ratings'])if(!L(c))S(c,seed[c]||[]);
  db={
   list:async c=>L(c),
   get:async(c,id)=>L(c).find(x=>x.id==id)||null,
   add:async(c,o)=>{const a=L(c),id=c[0]+Date.now();a.push({...o,id});S(c,a);return id},
   set:async(c,id,o)=>{const a=L(c).filter(x=>x.id!=id);a.push({...o,id});S(c,a)},
   upd:async(c,id,p)=>{S(c,L(c).map(x=>x.id==id?{...x,...p}:x))},
   upload:async f=>URL.createObjectURL(f)};
  auth={cur:()=>L('user'),
   login:async(e)=>{S('user',{uid:e.replace(/\W/g,''),email:e})},
   reg:async(e)=>{S('user',{uid:e.replace(/\W/g,''),email:e})},
   out:async()=>localStorage.removeItem('ts_user')};
 }else{
  const V="10.12.2",B=`https://www.gstatic.com/firebasejs/${V}/`;
  const [{initializeApp},F,A]=await Promise.all([import(B+"firebase-app.js"),import(B+"firebase-firestore-lite.js"),import(B+"firebase-auth.js")]);
  const app=initializeApp(FIREBASE_CONFIG),fs=F.getFirestore(app),au=A.getAuth(app);
  db={
   list:async(c,n)=>(await F.getDocs(n?F.query(F.collection(fs,c),F.orderBy('ts','desc'),F.limit(n)):F.collection(fs,c))).docs.map(d=>({...d.data(),id:d.id})),
   get:async(c,id)=>{const d=await F.getDoc(F.doc(fs,c,id));return d.exists()?{...d.data(),id:d.id}:null},
   add:async(c,o)=>(await F.addDoc(F.collection(fs,c),o)).id,
   set:async(c,id,o)=>F.setDoc(F.doc(fs,c,id),o),
   upd:async(c,id,p)=>F.updateDoc(F.doc(fs,c,id),p),
   upload:async(f,path,onp)=>import(B+"firebase-storage.js").then(ST=>new Promise((res,rej)=>{const r=ST.ref(ST.getStorage(app),path),t=ST.uploadBytesResumable(r,f);let last=Date.now();
    const w=setInterval(()=>{if(Date.now()-last>25000){clearInterval(w);t.cancel();rej(Error('Storage no responde. Revisa que Storage esté activado en Firebase y que las reglas estén publicadas.'))}},2000);
    t.on('state_changed',x=>{last=Date.now();onp&&onp(Math.round(x.bytesTransferred/x.totalBytes*100))},e=>{clearInterval(w);rej(e)},async()=>{clearInterval(w);res(await ST.getDownloadURL(r))})}))};
  let u=null;await new Promise(r=>A.onAuthStateChanged(au,x=>{u=x?{uid:x.uid,email:x.email}:null;r()}));
  A.onAuthStateChanged(au,x=>{u=x?{uid:x.uid,email:x.email}:null;});
  auth={cur:()=>u,
   login:async(e,p)=>{await A.signInWithEmailAndPassword(au,e,p)},
   reg:async(e,p)=>{await A.createUserWithEmailAndPassword(au,e,p)},
   out:async()=>A.signOut(au)};
 }
 await load();go('inicio');
}

/* ====== 3. ESTADO Y VISTAS ====== */
let biz=[],posts=[],ratings=[],myReact={},me=null,myFollow=[],view='inicio',arg=null,cat='Todos',cat2='Todos',zona='',lastLoad=0,q='';
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);return m<60?m+' min':m<1440?Math.round(m/60)+' h':Math.round(m/1440)+' d'};
const bz=id=>biz.find(b=>b.id==id);
async function load(){
 const [b,ps,rt]=await Promise.all([db.list('businesses'),db.list('posts',60),db.list('ratings')]);
 biz=b;posts=ps.filter(p=>Date.now()-p.ts<LIM.dias*864e5).sort((a,b)=>b.ts-a.ts);ratings=rt;

 $('hb').title=me?'Mi cuenta':'Iniciar sesión';

}

 const m=p.video?`<div class="pm vid" onclick="openShorts('${p.id}')"><video class="fv" src="${esc(p.video)}" poster="${thumbOf(p)}" muted loop playsinline preload="none"></video><div class="play">▶ Short</div></div>`:p.img?`<img class="pm" src="${p.img}" alt="" loading="lazy" decoding="async">`:'';
 return`<div class="pc"><div class="ph" onclick="go('negocio','${b.id}')"><div class="av sm">${avt(b)}</div><div><b>${esc(b.name)}</b><div class="mu">${icon(b.cat)} ${esc(b.cat)} · ${ago(p.ts)} · ⭐ ${stars(b)}<br>📍 ${esc(b.loc)}</div></div></div>${m}<div class="pt">${esc(p.text)}</div>${reactBar(p)}</div>`};

function render(){render0();autoplay()}
function render0(){
 navr();const A=$('app');
 if(view=='inicio'){
  const m=b=>(b.name+b.cat+b.loc+b.desc).toLowerCase().includes(q.toLowerCase());

  const fp=posts.filter(p=>fc.some(b=>b.id==p.bid)),V=vids().filter(p=>fc.some(b=>b.id==p.bid));
  A.innerHTML=`<div class="hero"><span class="mapi">🗺️<i>📍</i></span><span class="loc" onclick="setZona()">📍 ${esc(zona||'Guápiles, Pococí')} ⌄</span><h1>Descubre negocios<br>cerca de ti.</h1><p class="s" style="margin:0">Encuentra, sigue y descubre lo que los negocios ticos están publicando.</p></div>
  <div class="sb">🔍<input id="q" placeholder="Buscar negocio o ubicación" value="${esc(q)}"><span class="tg" onclick="setZona()">◎</span></div>
  <div class="row">${['Todos',...CATS.map(c=>c[1])].map(c=>`<div class="chip ${c==cat?'on':''}" onclick="setCat('${c}')">${c=='Todos'?'✨ Para ti':icon(c)+' '+c}</div>`).join('')}</div>
  <div class="sec"><h2>🎬 TicoSpot Shorts</h2>${V.length?`<a onclick="openShorts('${V[0].id}')">Ver todos ›</a>`:''}</div>
  <div class="row">${V.map((p,i)=>{const b=bz(p.bid),th=thumbOf(p);return`<div class="sc" ${th?`style="background-image:url('${th}')"`:''} onclick="openShorts('${p.id}')">${p.dur?`<span class="d">0:${String(Math.round(p.dur)).padStart(2,'0')}</span>`:''}${i==0?'<span class="pl">▶</span>':''}<div class="t">📍 ${esc(b.loc)}<b>${esc(b.name)}</b>▶ ${kfmt(p.views||0)}</div></div>`}).join('')||'<p class="mu">Aún no hay videos. ¡Publica el primero!</p>'}</div>
  <div class="sec"><h2>🏪 Negocios</h2><a onclick="setCat2('Todos')">Ver todos ›</a></div><div class="row" style="margin-bottom:12px">${['Todos',...CATS.map(c=>c[1])].map(c=>`<div class="chip ${c==cat2?'on':''}" onclick="setCat2('${c}')">${c=='Todos'?'Todos':icon(c)+' '+c}</div>`).join('')}</div>${f.sort((a,b)=>rtg(b)-rtg(a)).map(bizCard).join('')||'<p class="mu">Sin resultados.</p>'}
  <div class="sec"><h2>Descubre</h2></div>${fp.map(postCard).join('')||'<p class="mu">Sin publicaciones.</p>'}`;
  $('q').oninput=e=>{q=e.target.value;const p=e.target.selectionStart;render();$('q').focus();$('q').setSelectionRange(p,p)};
 }
 else if(view=='negocio'){
  const b=bz(arg);if(!b){A.innerHTML='<p>No encontrado</p>';return}
  const fl=myFollow.includes(b.id);const myr=(ratings.find(r=>r.bid==b.id&&me&&r.uid==me.uid)||{}).stars||0;
  A.innerHTML=`<div style="display:flex;gap:14px;align-items:center;margin-top:14px"><div class="av">${avt(b)}</div><div><h1 style="margin:0;font-size:24px">${esc(b.name)}</h1><div class="mu">${esc(b.cat)} · ⭐ ${stars(b)} · 👥 ${b.followers||0} seguidores</div></div></div>
  <p>${esc(b.desc)}</p><div class="mu">📍 ${esc(b.loc)}<br>🕐 ${esc(b.hours||'—')}</div>
  <div class="card" style="margin-top:12px"><b>⭐ ${stars(b)}</b><div class="mu">${myr?'Tu calificación:':'Califica este negocio:'}</div><div class="rate">${[1,2,3,4,5].map(n=>`<span class="${n<=myr?'on':''}" onclick="rate('${b.id}',${n})">★</span>`).join('')}</div></div>
  <div class="acts"><button class="btn" id="fb">${fl?'✓ Siguiendo':'+ Seguir'}</button>
  ${b.wa?`<a class="btn o" style="text-decoration:none" target="_blank" href="https://wa.me/${esc(b.wa)}">📱 WhatsApp</a>`:''}
  <a class="btn o" style="text-decoration:none" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(b.name+' '+b.loc+' Costa Rica')}">🗺️ Cómo llegar</a></div>
  <h2>Publicaciones</h2>${posts.filter(p=>p.bid==b.id).map(postCard).join('')||'<p class="mu">Aún sin publicaciones.</p>'}`;
  $('fb').onclick=async()=>{
   if(!me){alert('Inicia sesión para seguir negocios');return go('perfil')}
   const nf=fl?myFollow.filter(x=>x!=b.id):[...myFollow,b.id];
   myFollow=nf;await saveUser();
   await db.upd('businesses',b.id,{followers:Math.max(0,(b.followers||0)+(fl?-1:1))});
   go('negocio',b.id)};
 }
 else if(view=='siguiendo'){
  if(!me){A.innerHTML=`<h1>❤️ Guardados</h1><p class="s">Inicia sesión para ver las novedades de los negocios que sigues.</p><button class="btn" onclick="go('perfil')">Iniciar sesión</button>`;return}
  const fp=posts.filter(p=>myFollow.includes(p.bid));
  A.innerHTML=`<h1>❤️ Guardados</h1><p class="s">Nuevas publicaciones de los negocios que sigues.</p>${fp.map(postCard).join('')||'<p class="mu">Aún no sigues negocios (o no han publicado). Explora en Inicio.</p>'}`;
 }
 else if(view=='perfil'){
  if(me){const mine=biz.find(b=>b.owner==me.uid);
   A.innerHTML=`<h1>Mi cuenta</h1><p class="s">${esc(me.email)}</p>${mine?`<div style="display:flex;gap:14px;align-items:center;margin-bottom:14px"><div class="av">${avt(mine)}</div><div><b>${esc(mine.name)}</b><br><label class="btn o" style="display:inline-block;margin-top:6px">📷 Cambiar foto del negocio<input id="ph" type="file" accept="image/*" hidden></label></div></div>`:''}<div class="acts"><button class="btn" onclick="go('publicar')">Mi negocio / Publicar</button><button class="btn o" id="lo">Cerrar sesión</button></div>`;
   $('lo').onclick=async()=>{await auth.out();await load();go('inicio')};
   if(mine)$('ph').onchange=async e=>{const f=e.target.files[0];if(!f)return;await db.upd('businesses',mine.id,{photo:await shrink(f,320)});await load();render()};return}
  A.innerHTML=`<h1>Entrar a TicoSpot</h1>${DEMO?'<div class="msg">Modo demo: cualquier correo funciona, los datos se guardan solo en este navegador.</div>':''}
  <input id="em" type="email" placeholder="Correo (ej. nombre@gmail.com)" autocomplete="email" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="email"><input id="pw" type="password" placeholder="Contraseña (mín. 6)">
  <div class="acts"><button class="btn" id="li">Entrar</button><button class="btn o" id="rg">Crear cuenta</button></div><p class="mu" id="er"></p>`;
  const MSG={'auth/invalid-email':'Escribe un correo válido, por ejemplo nombre@gmail.com','auth/missing-password':'Escribe tu contraseña','auth/weak-password':'La contraseña debe tener mínimo 6 caracteres','auth/email-already-in-use':'Ese correo ya tiene cuenta. Toca "Entrar".','auth/invalid-credential':'Correo o contraseña incorrectos','auth/wrong-password':'Correo o contraseña incorrectos','auth/user-not-found':'No existe una cuenta con ese correo. Toca "Crear cuenta".','auth/too-many-requests':'Demasiados intentos. Espera unos minutos.','auth/network-request-failed':'Sin conexión a internet','auth/unauthorized-domain':'Este sitio no está autorizado en Firebase'};
  const run=f=>async()=>{const em=$('em').value.replace(/\s/g,'').toLowerCase();
   if(!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(em)){$('er').textContent='Escribe un correo válido, por ejemplo nombre@gmail.com';return}
   if($('pw').value.length<6){$('er').textContent='La contraseña debe tener mínimo 6 caracteres';return}
   try{$('er').textContent='Un momento…';await f(em,$('pw').value);await load();go('inicio')}catch(e){$('er').textContent=MSG[e.code]||e.message}};
  $('li').onclick=run(auth.login);$('rg').onclick=run(auth.reg);
 }
 else if(view=='publicar'){
  if(!me){A.innerHTML=`<h1>Publicar</h1><p class="s">Inicia sesión para registrar tu negocio.</p><button class="btn" onclick="go('perfil')">Iniciar sesión</button>`;return}
  const mine=biz.find(b=>b.owner==me.uid);
  if(!mine){
   A.innerHTML=`<h1>Registra tu negocio</h1><input id="n" placeholder="Nombre del negocio"><select id="c">${CATS.map(c=>`<option>${c[1]}</option>`).join('')}</select>
   <textarea id="d" rows="3" placeholder="Descripción"></textarea><input id="l" placeholder="Ubicación (ej. Guápiles, Pococí)"><input id="h" placeholder="Horario"><input id="w" placeholder="WhatsApp con código (50688888888)"><button class="btn" id="sv">Crear negocio</button>`;
   $('sv').onclick=async()=>{const n=$('n').value.trim();if(!n)return alert('Falta el nombre');
    await db.add('businesses',{name:n,cat:$('c').value,desc:$('d').value,loc:$('l').value,hours:$('h').value,wa:$('w').value.replace(/\D/g,''),rating:0,followers:0,owner:me.uid});await load();render()};
  }else{
   A.innerHTML=`<h1>Publicar como ${esc(mine.name)}</h1><p class="s">Comparte un estado u oferta con tus seguidores.</p>
   <textarea id="t" rows="3" placeholder="Ej: Cambio de aceite desde ₡15.000 🔧"></textarea><label class="mu">📷 Foto (opcional)</label><input id="i" type="file" accept="image/*"><label class="mu">🎬 Video corto (opcional, máx. ${LIM.seg} s · ${LIM.mb} MB)</label><input id="v" type="file" accept="video/*"><button class="btn" id="pb">Publicar</button>`;
   $('pb').onclick=async()=>{const t=$('t').value.trim();if(!t)return alert('Escribe algo');
    const btn=$('pb'),vf=$('v').files[0];
    try{btn.disabled=true;btn.textContent='Subiendo...';
     if(vf&&vf.size>LIM.mb*1e6)throw Error(`El video pesa más de ${LIM.mb} MB`);
     const dd=vf?await dur(vf):0;if(vf&&dd>LIM.seg+1)throw Error(`El video dura más de ${LIM.seg} segundos`);
     const img=$('i').files[0]?await shrink($('i').files[0]):'';
     const pg=p=>btn.textContent='Subiendo '+p+'%';
     const video=vf?await (CLOUD.cloud&&CLOUD.preset?cloudUp(vf,pg):db.upload(vf,`videos/${mine.id}_${Date.now()}`,pg)):'';
     await db.add('posts',{bid:mine.id,text:t,img,video,dur:dd,ts:Date.now()});await load();go('negocio',mine.id)
    }catch(e){alert('No se pudo publicar: '+e.message);btn.disabled=false;btn.textContent='Publicar'}};
  }
 }
}
window.setCat=c=>{cat=c;render()};
/* Reduce la foto para guardarla directo en Firestore (MVP; luego se migra a Storage) */
const shrink=(f,m=700)=>new Promise(r=>{const i=new Image;i.onload=()=>{const s=Math.min(1,m/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.7))};i.src=URL.createObjectURL(f)});

const vids=()=>posts.filter(p=>p.video&&bz(p.bid));
const dur=f=>new Promise(r=>{const v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=()=>r(v.duration);v.onerror=()=>r(0);v.src=URL.createObjectURL(f)});
window.openShorts=id=>{const Ls=vids(),el=$('shorts');
 document.querySelectorAll('.fv').forEach(v=>v.pause());
 el.innerHTML=Ls.map(p=>{const b=bz(p.bid);return`<div class="sv"><video src="${esc(p.video)}" poster="${thumbOf(p)}" preload="none" data-id="${p.id}" loop muted playsinline></video><div class="cap"><span class="tag" onclick="closeShorts();go('negocio','${b.id}')">${icon(b.cat)} ${esc(b.name)} · ⭐ ${stars(b)}</span><div class="big">${esc(p.text)}</div><div style="font-size:12px;opacity:.8">Toca el video para activar el sonido 🔊</div></div>${reactBar(p,'v')}</div>`}).join('')+'<button class="sx" onclick="closeShorts()">✕</button>';
 el.hidden=false;document.body.style.overflow='hidden';
 const io=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target;if(e.isIntersecting){v.play().catch(()=>{});const p=posts.find(x=>x.id==v.dataset.id);if(p&&!seen.has(p.id)){seen.add(p.id);p.views=(p.views||0)+1;db.upd('posts',p.id,{views:p.views}).catch(()=>{})}}else v.pause()}),{root:el,threshold:.7});
 el.querySelectorAll('video').forEach(v=>{io.observe(v);v.onclick=()=>{v.muted=!v.muted}});
 el._io=io;el.children[Math.max(0,Ls.findIndex(p=>p.id==id))]?.scrollIntoView();};
window.closeShorts=()=>{const el=$('shorts');el._io?.disconnect();el.querySelectorAll('video').forEach(v=>v.pause());el.hidden=true;el.innerHTML='';document.body.style.overflow='';autoplay()};
const rtg=b=>{const a=ratings.filter(r=>r.bid==b.id);return a.length?a.reduce((t,r)=>t+r.stars,0)/a.length:0};
const stars=b=>{const n=ratings.filter(r=>r.bid==b.id).length;return n?`${rtg(b).toFixed(1)} (${n})`:'Nuevo'};
const saveUser=()=>db.set('users',me.uid,{following:myFollow,reacts:myReact});
const RX=[['love','❤️','Me encanta'],['like','👍','Me gusta'],['dislike','👎','No me gusta']];
const reactBar=(p,v='')=>`<div class="rb ${v}" data-p="${p.id}" data-v="${v}">${RX.map(([k,e,l])=>`<button class="rx ${myReact[p.id]==k?'on':''}" onclick="react('${p.id}','${k}')"><b>${e}</b>${l} · ${(p.react||{})[k]||0}</button>`).join('')}</div>`;
window.react=async(pid,k)=>{
 if(!me){alert('Inicia sesión para reaccionar');return go('perfil')}
 const p=posts.find(x=>x.id==pid);if(!p)return;
 const r={love:0,like:0,dislike:0,...(p.react||{})},prev=myReact[pid];
 if(prev)r[prev]=Math.max(0,r[prev]-1);
 if(prev==k)delete myReact[pid];else{r[k]++;myReact[pid]=k}
 p.react=r;
 document.querySelectorAll(`[data-p="${pid}"]`).forEach(el=>{el.outerHTML=reactBar(p,el.dataset.v)});
 try{await db.upd('posts',pid,{react:r});await saveUser()}catch(e){alert('No se pudo guardar tu reacción: '+e.message)}};
window.rate=async(bid,n)=>{
 if(!me){alert('Inicia sesión para calificar');return go('perfil')}
 const b=bz(bid);if(b.owner==me.uid)return alert('No puedes calificar tu propio negocio');
 await db.set('ratings',`${bid}_${me.uid}`,{bid,uid:me.uid,stars:n});await load();render()};
let fio;function autoplay(){fio?.disconnect();
 fio=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target;(e.isIntersecting&&e.intersectionRatio>=.6)?v.play().catch(()=>{}):v.pause()}),{threshold:[0,.6]});
 document.querySelectorAll('.fv').forEach(v=>fio.observe(v))}
const seen=new Set();
const thumbOf=p=>p.thumb||(/cloudinary/.test(p.video||'')?p.video.replace(/\.\w+$/,'.jpg'):'');
const openNow=h=>{const m=[...(h||'').matchAll(/(\d{1,2})(?::(\d{2}))?\s*([ap])\.?m/gi)];if(m.length<2)return null;
 const t=x=>(+x[1]%12+(x[3].toLowerCase()=='p'?12:0))*60+(+x[2]||0),n=new Date(),c=n.getHours()*60+n.getMinutes(),a=t(m[0]),b=t(m[1]);return a<=b?(c>=a&&c<b):(c>=a||c<b)};
window.fol=async bid=>{if(!me){alert('Inicia sesión para guardar negocios');return go('perfil')}
 const b=bz(bid),on=myFollow.includes(bid);myFollow=on?myFollow.filter(x=>x!=bid):[...myFollow,bid];
 await saveUser();await db.upd('businesses',bid,{followers:Math.max(0,(b.followers||0)+(on?-1:1))});await load();render()};
const kfmt=n=>n>=1000?(n/1000).toFixed(1).replace(/\.0$/,'')+'k':n;
window.setCat2=c=>{cat2=c;render()};
window.setZona=()=>{const z=prompt('¿En qué zona buscas? (ej. Guápiles, Cariari, Pococí). Déjalo vacío para ver todas.',zona);if(z!==null){zona=z.trim();render()}};
init();
</script>
